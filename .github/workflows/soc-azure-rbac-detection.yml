                      continue
                  operation = get_text(event.get('operationName')).strip().lower()
                  category = get_text(event.get('category')).strip().lower()
                  status = get_text(event.get('status')).strip().lower()
                  timestamp = get_text(event.get('eventTimestamp'))
                  if category != 'administrative' or operation not in RBAC:

name: SOC - Azure RBAC detection validation

# This is a separate, manual-only validation workflow. It does not update Azure.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: soc-azure-rbac-detection
  cancel-in-progress: false

jobs:
  validate-rbac-reliability:
    if: github.repository == 'adamsawas10/multi-cloud-soc-incident-response' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Authenticate to Azure with short-lived OIDC token
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        env:
          AZURE_LOGIN_PRE_CLEANUP: 'true'
          AZURE_LOGIN_POST_CLEANUP: 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Test and run Azure RBAC reliability checks
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          python3 - <<'PY'

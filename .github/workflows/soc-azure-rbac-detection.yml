                  if operation_id:
                      key = ('operation', operation_id, operation, resource)
                  elif correlation_id:
                      key = ('correlation', correlation_id, operation, resource)
                  elif event_id:
                      key = ('event', event_id)
                  else:
                      key = ('index', index)
                  entry = groups.setdefault(key, {
                      'kind': RBAC[operation], 'statuses': set()
                  })
                  entry['statuses'].add(status)

              outcomes = Counter()
              for entry in groups.values():
                  statuses = entry['statuses']
                  if 'succeeded' in statuses and 'failed' in statuses:
                      outcome = 'CONFLICTING_REVIEW'
                  elif 'succeeded' in statuses:
                      outcome = 'COMPLETED_REVIEW'
                  elif 'failed' in statuses:
                      outcome = 'FAILED_ATTEMPT_REVIEW'
                  elif statuses and statuses <= {'started', 'accepted'}:
                      outcome = 'PENDING_NOT_CONFIRMED'
                  else:
                      outcome = 'UNKNOWN_STATUS_REVIEW'
                  outcomes[(entry['kind'], outcome)] += 1
              return accepted, len(groups), outcomes

          def example(operation, status, event_id='evt-1', op_id='op-1', category='Administrative'):
              return {
                  'operationName': {'value': operation},
                  'category': {'value': category},
                  'status': {'value': status},
                  'eventTimestamp': '2026-10-25T01:00:00Z',
                  'eventDataId': event_id,
                  'operationId': op_id,
                  'resourceId': '/example/roleAssignments/alpha',
              }

          def self_test():
              role_write = 'Microsoft.Authorization/roleAssignments/write'
              role_delete = 'Microsoft.Authorization/roleDefinitions/delete'
              policy_write = 'Microsoft.Authorization/policyAssignments/write'
              _, n, counts = summarize([example(role_write, 'Succeeded')])
              assert n == 1 and counts[('ROLE_ASSIGNMENT_WRITE', 'COMPLETED_REVIEW')] == 1
              _, n, counts = summarize([example(role_write, 'Started')])
              assert n == 1 and counts[('ROLE_ASSIGNMENT_WRITE', 'PENDING_NOT_CONFIRMED')] == 1
              _, n, counts = summarize([example(role_delete, 'Failed')])
              assert n == 1 and counts[('ROLE_DEFINITION_DELETE', 'FAILED_ATTEMPT_REVIEW')] == 1
              accepted, n, _ = summarize([example(policy_write, 'Started')])
              assert accepted == 0 and n == 0
              accepted, n, _ = summarize([example(role_write, 'Succeeded', category='Security')])
              assert accepted == 0 and n == 0
              a = example(role_write, 'Started', event_id='evt-a')
              b = example(role_write, 'Succeeded', event_id='evt-b')
              accepted, n, counts = summarize([a, b])
              assert accepted == 2 and n == 1 and counts[('ROLE_ASSIGNMENT_WRITE', 'COMPLETED_REVIEW')] == 1
              accepted, n, _ = summarize([a, a])
              assert accepted == 1 and n == 1
              c = example(role_write, 'Failed', event_id='evt-c')
              accepted, n, counts = summarize([b, c])
              assert n == 1 and counts[('ROLE_ASSIGNMENT_WRITE', 'CONFLICTING_REVIEW')] == 1
              d = example(role_write, 'Succeeded', event_id='evt-d', op_id='op-2')
              accepted, n, _ = summarize([b, d])
              assert n == 2
              print('PASS: 9 offline classification and correlation tests')

          self_test()
          subscription = os.environ.get('AZURE_SUBSCRIPTION_ID', '')
          if not subscription:
              print('INCOMPLETE: Azure subscription configuration missing')
              sys.exit(2)

          command = [
              'az', 'monitor', 'activity-log', 'list',
              '--subscription', subscription,
              '--offset', '7d', '--max-events', '500',
              '--output', 'json', '--only-show-errors',
          ]
          try:
              response = subprocess.run(
                  command, check=True, capture_output=True,
                  text=True, timeout=120,
              )
              events = json.loads(response.stdout)
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired,
                  FileNotFoundError, json.JSONDecodeError):
              # CLI stderr and raw audit records can contain identifiers: do not print.
              print('INCOMPLETE: Azure Activity Log retrieval failed')
              sys.exit(2)

          if not isinstance(events, list):
              print('INCOMPLETE: Azure returned an unexpected format')
              sys.exit(2)

          accepted, grouped, outcomes = summarize(events)
          print('PASS: Azure OIDC authenticated and Activity Log query completed')
          print(f'Activity Log records returned (7d, max 500): {len(events)}')
          print(f'RBAC records accepted: {accepted}')
          print(f'Candidate RBAC operations after in-run grouping: {grouped}')

          for (kind, outcome), count in sorted(outcomes.items()):
              print(f'REVIEW SIGNAL: {kind} / {outcome}: {count}')
          if not outcomes:
              print('PASS: No RBAC-change review signals in retrieved sample')

          print('PRIVACY: No raw events or account identifiers printed/uploaded')
          print('LIMIT: No persistent cross-run deduplication or alert delivery')
          print('LIMIT: Manual, 7-day sample; up to 500 records')
          print('OVERALL: PASS')
          PY
